<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Theseus, Socratic Reasoning Companion</title>
  <link rel="stylesheet" href="style.css">

  <!-- ✅ ADD D3 HERE (Step 1) -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
  <div id="app">

    <!-- Chat section -->
    <div id="chat-container">
      <div id="chat-log"></div>
      <input id="user-input" type="text" placeholder="Type your thought...">
    </div>

    <!-- Reasoning graph section -->
    <div id="graph-container">
        <h2>Golden Thread</h2>
        <pre id="graph-output"></pre>

        <!-- ✅ ADD THE GRAPH SVG CONTAINER HERE (Step 1) -->
        <div id="graph"></div>
    </div>

  </div>

  <!-- ⚠️ IMPORTANT: Script order must be BELOW the D3 include -->
  <script src="js/socraticEngine.js"></script>
  <script src="js/reasoningGraph.js"></script>
  <script src="js/uiController.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
